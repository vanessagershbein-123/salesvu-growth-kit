<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MealPool by SalesVu</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Emoji:wght@500&display=swap">
<style>
/* A personalized page a rep sends to one restaurant owner. Everything on it comes from the link itself
   (the part after #), made by the Call Prep tool. Look and wording follow the "MealPool by SalesVu" deck (Oct 2026). */
:root{
  --bg:#FFFFFF; --card:#F6F8FC; --card-line:#E4E9F2; --ink:#1B2B4B; --muted:#55657E; --line:#E4E9F2;
  --blue:#3D7BF7; --blue-ink:#2F62D6; --blue-soft:#EAF1FE; --sky:#8DB2FF;
  --navy:#1B2B4B; --navy-2:#24365A; --navy-line:rgba(255,255,255,.12);
  --green:#4CB872; --green-btn:#56B979; --green-soft:#EAF5EC; --green-ink:#1F5A33;
  --purple:#7656E3; --lav:#EEEAFB; --teal:#4DB6A8; --orange:#E07B39; --gold:#F5C14B;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:var(--blue);color:#fff}
[hidden]{display:none!important}
a{color:var(--blue-ink);text-underline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Header: MealPool wordmark, like the deck */
header{position:sticky;top:0;z-index:10;background:rgba(27,43,75,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--navy-line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.02em;color:#fff;text-decoration:none;white-space:nowrap}
.wordmark .pool{color:var(--green)}
.wordmark small{font-weight:600;font-size:13px;color:#B9C6DD;margin-left:8px;letter-spacing:0}
.hr{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;color:#B9C6DD}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.lang button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (max-width:420px){.wordmark small{display:none}}
.btn{font:inherit;font-size:15px;font-weight:700;border-radius:12px;padding:12px 20px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn.go{background:var(--green-btn);color:#0F2A19}
.btn.go:hover{background:#62C485}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}
.btn.ghost:hover{border-color:#fff}
.btn.small{font-size:14px;padding:9px 16px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* Hero: navy band, two-tone headline, a MealPool order card with real food */
.hero{background:var(--navy);color:#fff;padding-block:56px 64px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
@media (max-width:880px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:36px}}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple);background:var(--lav);padding:6px 14px;border-radius:8px}
h1{font-size:clamp(34px,4.6vw,56px);line-height:1.04;letter-spacing:-.035em;margin:20px 0 0;text-wrap:balance}
h1 .l2{display:block;color:var(--sky)}
.rule{width:44px;height:4px;border-radius:2px;background:var(--green);margin:22px 0}
.lede{font-size:clamp(18px,2.1vw,22px);color:#C9D4E6;max-width:34ch;margin:0 0 24px;line-height:1.45}
.control{display:inline-block;background:var(--green-soft);color:var(--green-ink);font-weight:700;border-radius:10px;padding:12px 18px;font-size:16px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.fine{font-size:13px;color:#9FB0CC;margin:18px 0 0}

.order{position:relative;background:#111A2C;border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:14px 14px 20px;box-shadow:0 30px 60px rgba(0,0,0,.35);max-width:440px;justify-self:end;width:100%}
@media (max-width:880px){.order{justify-self:start}}
.order .photo{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1181/400;background:#2A2016}
.order .photo img{width:100%;height:100%;object-fit:cover;display:block}
.order .tag{position:absolute;top:10px;font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px}
.order .tag.live{left:10px;background:#E5487D;color:#fff}
.order .tag.ill{right:10px;background:rgba(17,26,44,.85);color:#E6ECF5}
.order .pw{position:relative}
.order .logo{position:absolute;left:18px;bottom:-30px;width:68px;height:68px;border-radius:50%;border:3px solid #111A2C;background:#fff}
.order .body{padding:40px 8px 0}
.order .ttl{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.order .big{font-size:30px;font-weight:800;color:var(--gold);margin:10px 0 0;letter-spacing:-.02em}
.order .sky{color:#7FD3E6;font-weight:600;font-size:15px}
.bar{height:8px;border-radius:4px;background:#2A3550;margin:14px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:76%;background:var(--teal);border-radius:4px}
.order .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#C9D4E6}
.order .meta{font-weight:700;font-size:14px;margin-top:10px}
.order .join{display:block;margin-top:16px;background:var(--green-btn);color:#0F2A19;font-weight:800;text-align:center;border-radius:12px;padding:12px}
.order .small{font-size:11px;color:#8C9BB5;text-align:center;margin-top:8px}

/* Sections */
section.block{padding-block:64px}
section.block.tint{background:var(--card)}
h2{font-size:clamp(28px,3.8vw,42px);line-height:1.1;letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance}
h2 .b{color:var(--blue);display:block}
.sub{color:var(--muted);margin:0 0 32px;max-width:62ch;font-size:17px}
.card{background:#fff;border:1px solid var(--card-line);border-radius:18px;padding:24px;box-shadow:0 1px 2px rgba(27,43,75,.04),0 10px 30px rgba(27,43,75,.05)}
.tint .card{background:#fff}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}
.stat .top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.ico{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#fff;flex:none}
.ico svg{width:20px;height:20px}
.stat .num{font-size:clamp(46px,6vw,60px);font-weight:800;letter-spacing:-.04em;line-height:1;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.stat p{margin:0;color:var(--muted);font-size:15px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:stretch}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.places{list-style:none;margin:0;padding:0;display:grid}
.places li{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.places li:first-child{border-top:0;padding-top:0}
.places li span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.est{background:var(--green-soft);border:0;box-shadow:none;color:var(--green-ink);display:grid;align-content:center;gap:8px}
.est strong{font-size:clamp(22px,2.6vw,28px);line-height:1.2;letter-spacing:-.02em}
.est small{font-size:14px;opacity:.85}
.greenbar{margin-top:20px;background:var(--green-soft);color:var(--green-ink);border-radius:12px;padding:16px 20px;font-weight:700;text-align:center;font-size:17px}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.steps{grid-template-columns:minmax(0,1fr)}}
.step h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.step h3::before{content:"";width:5px;height:24px;border-radius:2px;background:var(--c,var(--blue))}
.step ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.step li{position:relative;padding-left:20px;color:var(--ink);font-size:15.5px}
.step li::before{content:"";position:absolute;left:4px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--blue))}
.diners{margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.diners{grid-template-columns:minmax(0,1fr)}}
.diner{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.diner svg{width:20px;height:20px;color:var(--purple);margin-top:3px;grid-row:span 2}
.diner strong{font-size:16px}
.diner span{color:var(--muted);font-size:14.5px}

.free{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.feenote{margin:12px 0 0;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:640px){.free{grid-template-columns:minmax(0,1fr)}}
.free .card{text-align:center;position:relative;background:var(--blue-soft);border-color:#DCE6FB}
.free .card::before{content:"";position:absolute;top:-1px;left:24px;width:40px;height:4px;border-radius:2px;background:var(--blue)}
.free h3{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #D3DEF5;font-size:18px;letter-spacing:.02em;text-transform:uppercase}
.free .money{font-size:clamp(52px,7vw,72px);font-weight:800;letter-spacing:-.04em;line-height:1}
.free .money small{font-size:20px;font-weight:700;letter-spacing:0;margin-left:8px}

.checks{display:grid;gap:10px}
.check{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0;padding-top:0}
.check b{font-size:13px;font-weight:700;white-space:nowrap;padding:3px 10px;border-radius:999px}
.check b.ok{color:var(--green-ink);background:var(--green-soft)}.check b.fix{color:#9A3F0C;background:#FDEEE3}.check b.unk{color:var(--muted);background:var(--card)}
.help{display:grid;gap:18px;counter-reset:h}
.help div{display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.help div::before{counter-increment:h;content:counter(h);grid-row:span 2;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:14px;background:var(--teal)}
.help div:nth-child(2)::before{background:var(--purple)}.help div:nth-child(3)::before{background:var(--green)}
.help strong{font-size:17px}
.help p{margin:0;color:var(--muted);font-size:15px}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.cards{grid-template-columns:minmax(0,1fr)}}
.cards .card h3{margin:14px 0 6px;font-size:17px}
.cards .card p{margin:0;color:var(--muted);font-size:15px}

/* Closing band: navy like the deck's last slide */
.close{background:var(--navy);color:#fff;padding-block:64px}
.close h2{color:#fff}
.close h2 .b{color:var(--sky)}
.close .sub{color:#C9D4E6}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;background:var(--navy-2);border:1px solid var(--navy-line);border-radius:20px;padding:clamp(20px,3vw,32px)}
.field{display:grid;gap:6px}
label{font-size:14px;font-weight:600;color:#E6EDF7}
input,select{font:inherit;font-size:16px;width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff}
input::placeholder{color:#9FB3CC}
select option{color:#1B2B4B}
.form-go{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.thanks{grid-column:1/-1;background:rgba(76,184,114,.18);border-radius:12px;padding:14px 16px;color:#D9F5E2}
footer{background:var(--navy);border-top:1px solid var(--navy-line);color:#9FB0CC;font-size:13px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 30px}
.foot .wordmark{font-size:20px}
.foot .wordmark .vu{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<header><div class="wrap head">
  <a class="wordmark" href="#top">Meal<span class="pool">Pool</span><small>by SalesVu</small></a>
  <div class="hr"><div class="lang" role="group" aria-label="Idioma / Language"><button type="button" data-l="es">ES</button><button type="button" data-l="en">EN</button></div>
  <a class="btn go small" href="#empezar" id="h-cta"></a></div>
</div></header>

<main id="top">
  <section class="hero"><div class="wrap hero-grid">
    <div>
      <span class="pill" id="badge"></span>
      <h1 id="h1"></h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="lede" id="lede"></p>
      <div class="control" id="control"></div>
      <div class="ctas"><a class="btn go" href="#empezar" id="cta1"></a><a class="btn ghost" href="#oficinas" id="cta2"></a></div>
      <p class="fine" id="fine"></p>
    </div>
    <div class="order" aria-label="Example group lunch order">
      <div class="pw"><div class="photo"><img src="assets/tacos.jpg" alt="" width="1181" height="315"><span class="tag live" id="o-live"></span><span class="tag ill" id="o-ill"></span></div>
      <canvas class="logo" id="logo" width="240" height="240" aria-hidden="true"></canvas></div>
      <div class="body">
        <p class="ttl" id="o-title"></p>
        <div class="big" id="o-big"></div>
        <div class="sky" id="o-sky"></div>
        <div class="bar"><i></i></div>
        <div class="row"><span id="o-count"></span><span id="o-cut"></span></div>
        <div class="join" id="o-join"></div>
        <div class="small" id="o-small"></div>
      </div>
    </div>
  </div></section>

  <section class="block" id="oficinas"><div class="wrap">
    <h2 id="o-h"></h2><p class="sub" id="o-sub"></p>
    <div class="stats" id="o-stats"></div>
    <div class="split">
      <div class="card"><p class="label" id="o-list-h"></p><ul class="places" id="o-list"></ul></div>
      <div class="card est" id="o-est"></div>
    </div>
  </div></section>

  <section class="block tint" id="como"><div class="wrap">
    <h2 id="c-h"></h2><p class="sub" id="c-sub"></p>
    <div class="steps" id="c-steps"></div>
    <div class="card diners" id="c-diners"></div>
  </div></section>

  <section class="block" id="gratis"><div class="wrap">
    <h2 id="g-h"></h2>
    <div class="free" id="g-cards"></div>
    <div class="greenbar" id="g-bar"></div>
    <p class="feenote" id="g-fee"></p>
  </div></section>

  <section class="block tint" id="presencia"><div class="wrap">
    <h2 id="p-h"></h2><p class="sub" id="p-sub"></p>
    <div class="split"><div class="card"><div class="checks" id="p-checks"></div></div><div class="card"><div class="help" id="p-help"></div></div></div>
  </div></section>

  <section class="block" id="salesvu"><div class="wrap">
    <h2 id="s-h"></h2><p class="sub" id="s-sub"></p>
    <div class="cards" id="s-cards"></div>
  </div></section>

  <section class="close" id="empezar"><div class="wrap">
    <h2 id="f-h"></h2><p class="sub" id="f-sub"></p>
    <form id="f" autocomplete="on">
      <div class="field"><label for="f-name" id="l-name"></label><input id="f-name" name="name" type="text" autocomplete="name"></div>
      <div class="field"><label for="f-phone" id="l-phone"></label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div class="field"><label for="f-meals" id="l-meals"></label><select id="f-meals" name="meals"></select></div>
      <div class="field"><label for="f-time" id="l-time"></label><select id="f-time" name="time"></select></div>
      <div class="form-go"><button type="submit" class="btn go" id="f-go"></button><span id="f-note" style="font-size:13px;color:#C9D4E6"></span></div>
      <div class="thanks" id="f-thanks" hidden></div>
    </form>
  </div></section>
</main>
<footer><div class="wrap foot"><span id="foot"></span><span class="wordmark">Sales<span class="vu">Vu</span></span></div></footer>

<script>
(function(){
const $=id=>document.getElementById(id);
/* The tool puts this restaurant's details after #d= (base64 JSON). With no data, show a clearly marked example. */
function readData(){try{const h=new URLSearchParams(location.hash.slice(1)).get('d');if(!h)return null;
  const b=atob(h.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(decodeURIComponent(escape(b)));}catch(e){return null;}}
const EXAMPLE={n:'Taquería Los Compadres',c:'Houston, TX',lg:'es',demo:1,
  ofs:{n:43,r:1,top:[['Frost Bank',0.1,'office'],['EaDo Family Dental',0.1,'health'],['Urban Office',0.2,'office'],['Houston International Brokers',0.2,'office'],['Iridium Pharmacy',0.2,'health']],cats:[['office',21],['gov',8],['school',6],['health',5]]},
  pr:{good:['gmaps','fb'],bad:['order','apps','web']},kit:1};
const D=readData()||EXAMPLE,HP=new URLSearchParams(location.hash.slice(1)),es=(HP.get('lang')||D.lg)!=='en',T=(a,b)=>es?a:b;
/* ES / EN switch: keeps the restaurant's data in the link and redraws the page in the other language. */
document.querySelectorAll('.lang button').forEach(b=>{b.setAttribute('aria-pressed',String((b.dataset.l==='es')===es));
  b.onclick=()=>{const h=new URLSearchParams(location.hash.slice(1));h.set('lang',b.dataset.l);location.hash=h.toString();location.reload();};});
document.documentElement.lang=es?'es':'en';
const R=D.n||T('su restaurante','your restaurant'),rep=D.r||'SalesVu';
const SVG=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={office:'<rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/>',
  health:'<path d="M12 5v14M5 12h14"/>',school:'<path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 11v5c3 2 7 2 10 0v-5"/>',
  gov:'<path d="M4 20h16M5 10h14M12 4l8 5H4l8-5Z"/><path d="M7 10v8M12 10v8M17 10v8"/>',cars:'<path d="M5 16h14M6 16l1.5-5h9L18 16"/><circle cx="8" cy="17.5" r="1.5"/><circle cx="16" cy="17.5" r="1.5"/>',
  industry:'<path d="M3 20V10l5 3V10l5 3V6h4v14H3Z"/>',cart:'<path d="M4 4h2l2.4 10.2a1 1 0 0 0 1 .8h8.2a1 1 0 0 0 1-.8L20 8H7"/><circle cx="10" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>',
  pct:'<path d="M19 5 5 19"/><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="17" r="2.5"/>',people:'<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M14 19a4 4 0 0 1 7-2.6"/>',
  mega:'<path d="M4 10v4a1 1 0 0 0 1 1h2l6 4V5L7 9H5a1 1 0 0 0-1 1Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/>',check:'<path d="m5 12 5 5 9-10"/>'};
const CAT={office:['Oficinas','Offices','var(--blue)'],health:['Salud','Health','var(--green)'],school:['Escuelas','Schools','var(--teal)'],gov:['Gobierno','Government','var(--purple)'],cars:['Agencias y talleres','Dealers & shops','var(--orange)'],industry:['Industria y bodegas','Industry & warehouses','#64748B']};
const radL=mi=>es?(mi===0.5?'media milla':mi===1?'1 milla':mi+' millas'):(mi===0.5?'half a mile':mi===1?'1 mile':mi+' miles');
const txt=(id,t)=>{$(id).textContent=t;};
const two=(id,a,b)=>{const h=$(id);h.textContent='';h.append(a);const s=document.createElement('span');s.className='b';s.textContent=b;h.appendChild(s);};
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html)e.innerHTML=html;return e;};

document.title=`${R} · MealPool by SalesVu`;
txt('h-cta',T('Quiero empezar','Get started'));

/* Logo: the restaurant's name in the MealPool collateral style, with Mexican-food icons (Noto Emoji). */
function drawLogo(){const c=$('logo'),x=c.getContext('2d'),r=120;x.clearRect(0,0,240,240);x.save();x.beginPath();x.arc(r,r,r,0,Math.PI*2);x.clip();
  x.fillStyle='#EEF4FF';x.fillRect(0,0,240,240);x.globalAlpha=.55;x.fillStyle='#3D7BF7';x.font='500 30px "Noto Emoji",sans-serif';x.textAlign='center';x.textBaseline='middle';
  const F=['🌮','🌶','🥑','🌯','🌽','🌮','🌵','🍋'];let k=0;for(let y=10;y<250;y+=54){for(let xx=(k%2?37:10);xx<250;xx+=56){x.save();x.translate(xx,y);x.rotate(((k*47)%40-20)*Math.PI/180);x.fillText(F[k%F.length],0,0);x.restore();k++;}}
  x.globalAlpha=1;x.beginPath();x.arc(r,r,84,0,Math.PI*2);x.fillStyle='#fff';x.fill();
  const words=R.split(' '),lines=[];let line='';x.font='800 26px Inter, sans-serif';words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>130&&line){lines.push(line);line=w;}else line=t;});if(line)lines.push(line);
  const L=lines.slice(0,3),lh=28;let yy=r-((L.length-1)*lh)/2-6;x.fillStyle='#1B2B4B';L.forEach(l=>{x.fillText(l,r,yy);yy+=lh;});
  x.fillStyle='#4CB872';x.fillRect(r-20,yy-8,40,5);x.restore();}
drawLogo();if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('500 30px "Noto Emoji"','🌮🌶🥑'),document.fonts.load('800 26px Inter')]).then(drawLogo,()=>{});
})();
